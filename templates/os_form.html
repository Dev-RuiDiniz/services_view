<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Ordem de Serviço</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Criar Nova Ordem de Serviço</h1>
    <form method="post" action="/os/novo">
      <div class="mb-3">
        <label for="os_num" class="form-label">Número da OS</label>
        <input type="text" class="form-control" id="os_num" name="os_num" required />
      </div>

      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo</label>
        <select class="form-select" id="tipo" name="tipo" required>
          <option value="serviço">Serviço</option>
          <option value="garantia">Garantia</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="cliente" class="form-label">Cliente</label>
        <input type="text" class="form-control" id="cliente" name="cliente" required />
      </div>

      <div class="mb-3">
        <label for="equipamento" class="form-label">Equipamento</label>
        <input type="text" class="form-control" id="equipamento" name="equipamento" required />
      </div>

      <div class="mb-3">
        <label for="entrada" class="form-label">Data de Entrada</label>
        <input type="date" class="form-control" id="entrada" name="entrada" required />
      </div>

      <div class="mb-3">
        <label for="prazo_entrega" class="form-label">Prazo de Entrega</label>
        <input type="date" class="form-control" id="prazo_entrega" name="prazo_entrega" required />
      </div>

      <!-- Campo status removido pois o sistema define automaticamente -->
      <!--
      <div class="mb-3">
        <label for="status_os" class="form-label">Status</label>
        <input type="text" class="form-control" id="status_os" name="status_os" value="pendente" readonly />
      </div>
      -->

      <button type="submit" class="btn btn-primary">Criar Ordem</button>
      <a href="/" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
