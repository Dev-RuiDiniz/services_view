<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Editar OS</title>
    <link rel="stylesheet" href="{{ url_for('static', path='main.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos específicos que não estão no main.css */
        .container { 
            /* Manter largura máxima se o main.css tiver uma largura maior */
            max-width: 600px; 
            margin: 40px auto; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ Editar Ordem de Serviço #{{ os.os_num }}</h1>
        <p>ID do Registro: **{{ os.id }}**</p>

        <form method="POST" action="{{ url_for('update_os', os_id=os.id) }}">

            <div class="form-group">
                <label for="os_num">Número da OS:</label>
                <input type="text" id="os_num" name="os_num" value="{{ os.os_num }}" required>
            </div>

            <div class="form-group">
                <label for="cliente">Cliente:</label>
                <input type="text" id="cliente" name="cliente" value="{{ os.cliente }}" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo" required>
                    <option value="Manutenção" {% if os.tipo == "Manutenção" %}selected{% endif %}>Manutenção</option>
                    <option value="Instalação" {% if os.tipo == "Instalação" %}selected{% endif %}>Instalação</option>
                    <option value="Orçamento" {% if os.tipo == "Orçamento" %}selected{% endif %}>Orçamento</option>
                    <option value="Outro" {% if os.tipo == "Outro" %}selected{% endif %}>Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="equipamento">Equipamento:</label>
                <input type="text" id="equipamento" name="equipamento" value="{{ os.equipamento }}" required>
            </div>
            
            <div class="form-group">
                <label for="prazo_entrega">Prazo de Entrega:</label>
                {% set prazo_iso = os.prazo_entrega.isoformat() if os.prazo_entrega else '' %}
                <input type="date" id="prazo_entrega" name="prazo_entrega" value="{{ prazo_iso }}">
            </div>

            <div class="form-group">
                <label for="status">Status Atual:</label>
                <select id="status" name="status">
                    <option value="Pendente" {% if os.status == "Pendente" %}selected{% endif %}>Pendente</option>
                    <option value="Em Andamento" {% if os.status == "Em Andamento" %}selected{% endif %}>Em Andamento</option>
                    <option value="Aguardando Peças" {% if os.status == "Aguardando Peças" %}selected{% endif %}>Aguardando Peças</option>
                    <option value="Concluída" {% if os.status == "Concluída" %}selected{% endif %}>Concluída</option>
                    <option value="Cancelada" {% if os.status == "Cancelada" %}selected{% endif %}>Cancelada</option>
                </select>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('list_os') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</body>
</html>
