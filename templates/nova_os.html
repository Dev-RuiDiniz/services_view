<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nova Ordem de Serviço</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-5">
    <h1>Criar Nova OS</h1>
    <form method="post" action="/os/novo">
      <div class="mb-3">
        <label class="form-label">OS</label>
        <input class="form-control" name="os_num" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" name="tipo" required>
          <option value="serviço">Serviço</option>
          <option value="garantia">Garantia</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Cliente</label>
        <input class="form-control" name="cliente" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Equipamento</label>
        <input class="form-control" name="equipamento" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Entrada</label>
        <input type="date" class="form-control" name="entrada" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Prazo de Entrega</label>
        <input type="date" class="form-control" name="prazo_entrega" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status" required>
          <option value="pendente">Pendente</option>
          <option value="finalizada">Finalizada</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Criar OS</button>
      <a href="/" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
  </div>
</body>
</html>
