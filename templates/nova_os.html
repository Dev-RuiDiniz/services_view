<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    </head>
<body>
    <h1>Criar Nova Ordem de Serviço ({{ title }})</h1>
    
    <form action="{{ url_for('create_os') }}" method="post">
        
        <label for="os_num">Número da OS (Obrigatório):</label>
        <input type="text" id="os_num" name="os_num" required><br><br>

        <label for="cliente">Cliente (Obrigatório):</label>
        <input type="text" id="cliente" name="cliente" required><br><br>

        <label for="tipo">Tipo (Obrigatório):</label>
        <input type="text" id="tipo" name="tipo" required><br><br>
        
        <label for="equipamento">Equipamento (Obrigatório):</label>
        <input type="text" id="equipamento" name="equipamento" required><br><br>

        <label for="status">Status (Obrigatório):</label>
        <select id="status" name="status" required>
            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Aguardando Peça">Aguardando Peça</option>
            <option value="Concluída">Concluída</option>
            <option value="Cancelada">Cancelada</option>
        </select><br><br>

        <label for="prazo_entrega">Prazo de Entrega (Opcional):</label>
        <input type="date" id="prazo_entrega" name="prazo_entrega"><br><br>

        <button type="submit">Criar OS</button>
        <a href="{{ url_for('list_os') }}">Cancelar</a>
    </form>
</body>
</html>
